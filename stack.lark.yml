version: '3.8'

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: squid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    shm_size: 1gb
    networks:
      - default
    deploy:
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 2G

  indexer:
    image: galacticcouncil/multix-indexer:hydration-latest
    command:
      - sh
      - -c
      - npx squid-typeorm-migration apply && npx sqd start-hydration
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: squid
      DB_USER: postgres
      DB_PASS: postgres
      SQD_DEBUG: sqd:processor:mapping
    networks:
      - default
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          memory: 2G

  graphql:
    image: galacticcouncil/multix-indexer:hydration-latest
    command:
      - npx
      - squid-graphql-server
      - --sql-statement-timeout
      - '10000'
      - --dumb-cache
      - in-memory
      - --dumb-cache-ttl
      - '1000'
      - --dumb-cache-size
      - '100'
      - --dumb-cache-max-age
      - '1000'
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: squid
      DB_USER: postgres
      DB_PASS: postgres
      GQL_PORT: '4350'
    networks:
      - default
      - gateway
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 512M
      labels:
        - traefik.http.routers.multix-graphql.rule=Host(`multix-graphql.lark.hydration.cloud`)
        - traefik.http.routers.multix-graphql.tls=true
        - traefik.http.routers.multix-graphql.tls.certresolver=myresolver
        - traefik.http.services.multix-graphql.loadbalancer.server.port=4350

  ui:
    image: galacticcouncil/multix-ui:hydration-latest
    networks:
      - gateway
    deploy:
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          memory: 128M
      labels:
        - traefik.http.routers.multix-ui.rule=Host(`multix.lark.hydration.cloud`)
        - traefik.http.routers.multix-ui.tls=true
        - traefik.http.routers.multix-ui.tls.certresolver=myresolver
        - traefik.http.services.multix-ui.loadbalancer.server.port=80

networks:
  default:
    driver: overlay
  gateway:
    external: true

volumes:
  db_data:
